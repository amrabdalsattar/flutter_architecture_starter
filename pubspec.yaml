name: flutter_architecture_starter
description: "Flutter Architecture Starter — A well-structured template for building scalable Flutter applications with clean architecture principles"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Bloc State Management
  flutter_bloc: ^9.1.1
  event_bus: ^2.0.1

  # Networking http client (For API Calls)
  dio: ^5.9.2

  # Caching Helper for usual Data
  shared_preferences: ^2.5.5
  
  # Encrypted Caching Helper for sensitive data such as token
  flutter_secure_storage: ^10.0.0
  
  # Network Images Caching Handler
  cached_network_image: ^3.4.1

  # Dependency Injection
  get_it: ^9.2.1

  # A library that checks for internet by opening a socket to a list of specified addresses
  internet_connection_checker: ^3.0.1

  # Crash Reporting & Monitoring Service
  sentry_flutter: ^9.16.0
  
  # Services Packages
  image_picker: ^1.2.1
  url_launcher: ^6.3.2

  # Utilities Packages
  intl: ^0.20.2
  
  # An SVG rendering and widget library
  flutter_svg: ^2.2.4

  # Firebase Services (Mainly for Notifications and App Distribution)
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^21.0.0

  # Deep Linking
  app_links: ^7.0.0

  # UI Packages
  skeletonizer: ^2.1.3
  flutter_debouncer: ^2.1.1
  lottie: ^3.3.2
  carousel_slider: ^5.1.2
  another_flushbar: ^1.12.32
  page_transition: ^2.2.1
  flutter_animate: ^4.5.2

  # Value Equality Package (For Equatable Models and Bloc States)
  equatable: ^2.0.8

  # Localization
  easy_localization: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Development utility packages
  flutter_lints: ^6.0.0
  rename: ^3.1.0

  # Splash & App Icon Generator
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

  # Dio interceptor that logs network calls in a pretty, easy to read format. 
  pretty_dio_logger: ^1.4.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Light.ttf
          weight: 300
        - asset: assets/fonts/Rubik-Regular.ttf
          weight: 400
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700
        - asset: assets/fonts/Rubik-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Rubik-Black.ttf
          weight: 900